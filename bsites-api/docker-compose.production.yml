version: '3'
services:
#  bsites-ui:
#    container_name: bsites-ui
#    image: bsites-ui:latest
#    ports:
#      - '3030:80'
#    environment:
#      - BASE_API_URL=http://bsites-api:4000/
#    networks:
#      - bsitesapi
#    restart: always
#    stdin_open: true
#    tty: true
  bsites-api:
    container_name: bsites-api
    image: bsites-api:latest
#    build:
#      context: .
#      dockerfile: ./Dockerfile-pro
    command: npm run start:prod
    ports:
      - '${APP_PORT}:4000'
    environment:
      NODE_ENV: '${NODE_ENV}'
    networks:
      - bsitesapi
    depends_on:
      - mongo
      - redis
    volumes:
#      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
  mongo:
    image: mongo
    container_name: bsites-mongo
    restart: always
    ports:
      - '${MONGO_PORT}:27017'
    environment:
      MONGO_INITDB_DATABASE: '${DATABASE}'
      MONGO_INITDB_ROOT_USERNAME: '${DATABASE_USER}'
      MONGO_INITDB_ROOT_PASSWORD: '${DATABASE_PASSWORD}'
    volumes:
      - bsitesmongo:/data/db
    networks:
      - bsitesapi
  redis:
    image: redis:alpine
    container_name: bsites-redis
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - bsitesredis:/data
    networks:
      - bsitesapi
networks:
  bsitesapi:
    driver: 'bridge'
volumes:
  bsitesredis:
    driver: 'local'
  bsitesmongo:
    driver: 'local'
